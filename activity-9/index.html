<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity 9: Contact Form Validation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>Activity 9: Contact Form Validation</h1>
  <p>Open the browser console (F12) to see form handling demonstrations!</p>

  <div class="form-container">

    <form id="contactForm" novalidate>

      <!-- Name -->
      <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" placeholder="Enter your full name" />
        <div class="error-message" id="nameError"></div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" placeholder="your.email@example.com" />
        <div class="error-message" id="emailError"></div>
      </div>

      <!-- Message -->
      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" rows="5" placeholder="Enter your message..."></textarea>
        <div class="error-message" id="messageError"></div>
      </div>

      <!-- Button -->
      <button type="submit" id="submitBtn" disabled>Send</button>

      <!-- Success -->
      <div id="formSuccess" class="hidden">
         Message sent successfully!
      </div>

    </form>

  </div>

  <script src="scripts.js"></script>
</body>
</html>
